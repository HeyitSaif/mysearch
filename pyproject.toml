[project]
name = "mysearch"
version = "0.1.2"
license = "MIT"
description = "Local multimodal search engine for your folders (EmbeddingGemma 2 on MLX, SQLite FTS5 + sqlite-vec)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "sqlite-vec==0.1.9",
    # The daemon itself is stdlib-only; everything below is loaded by the embedding worker process.
    "mlx>=0.32.3",
    "mlx-vlm @ git+https://github.com/Blaizzy/mlx-vlm.git@fec3f50379bb2cb0760ef3c8a68ebce9585e4d97",
    "transformers>=5.14.0",
    "numpy",
    "pillow",
    "mlx-lm>=0.32.0",
]

[project.scripts]
mse = "mse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["mse"]

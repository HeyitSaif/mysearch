name: Release

# Manual only (workflow_dispatch): this project does not use GitHub Actions minutes. A release is tested, built and
# uploaded from a Mac by the maintainer — the local pre-push hook (scripts/hooks/pre-push) runs the tests and, for a
# version tag, the ad-hoc DMG build; docs/RELEASING.md has the steps. Nothing here runs on a push or a tag.
# When dispatched by hand for an existing tag, it runs the same checks and build and creates a DRAFT release with the
# DMG and its SHA-256, unless a release for that tag already exists. Releases stay drafts: a maintainer publishes them.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v0.1.3)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-draft:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    permissions:
      contents: write                  # only this job may write: it creates the draft release, with GITHUB_TOKEN
    steps:
      - name: Check out the tagged code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Public-release audit (generic checks)
        run: python3 scripts/oss_audit.py .

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.4"
          enable-cache: false

      - name: Install the locked environment (no models are downloaded)
        run: uv sync --frozen

      - name: Unit tests
        run: uv run python -m unittest discover -s tests -t .

      - name: Build the helper and the app (ad hoc, no signing identity)
        run: ./scripts/build_dmg.sh --adhoc --out build/release

      - name: Checksum the DMG
        run: |
          cd build/release
          shasum -a 256 MySearch.dmg > MySearch.dmg.sha256
          cat MySearch.dmg.sha256

      - name: Create the draft release (skipped when a release for the tag already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "A release for $TAG already exists; nothing is created or changed. The DMG is in build/release."
            exit 0
          fi
          sha="$(cut -d ' ' -f 1 build/release/MySearch.dmg.sha256)"
          gh release create "$TAG" \
            --repo "$REPO" \
            --verify-tag \
            --draft \
            --title "MySearch $TAG" \
            --notes "Draft for review. SHA-256 of MySearch.dmg: $sha" \
            build/release/MySearch.dmg \
            build/release/MySearch.dmg.sha256
